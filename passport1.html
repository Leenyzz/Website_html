      top: calc(var(--y) / 457 * 100%);
      width: calc(var(--w) / 330 * 100%);
      height: calc(var(--h) / 457 * 100%);

      align-items: center;
      justify-content: center;
      white-space: nowrap;
      background: #f6e8e8;
      color: #23232e;

      font-weight: bold;
      font-size: 3.5cqw;
      letter-spacing: 0.02em;

    .ov.name       { --x: 164; --y: 287; --w: 56;  --h: 14; }
